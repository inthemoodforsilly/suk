<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Happy Birthday Suki</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caprasimo&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #ecead4;
    --cream-2: #f6f4e4;
    --ink: #2c3a87;
    --ink-soft: #5a67b4;
    --display: "Caprasimo", "Cooper Black", "Georgia", serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { margin:0; height:100%; overflow:hidden; }
  body {
    margin:0; height:100vh; height:100dvh; position:relative; overflow:hidden;
    font-family: system-ui, "Segoe UI", sans-serif;
    color: var(--ink); background: var(--cream);
    display:flex; flex-direction:column; align-items:center;
    padding: 10px 14px 12px; touch-action: manipulation;
  }

  /* header */
  #cake { height: clamp(46px, 10vh, 100px); width:auto; display:block; margin: 0 auto 2px; flex:none; }
  h1 {
    font-family: var(--display); font-weight:400; text-align:center;
    margin: 2px 0 2px; line-height:1.1; flex:none;
    font-size: clamp(1.5rem, min(7vw, 6vh), 3rem);
    transition: transform .6s cubic-bezier(.2,1.4,.4,1);
  }
  h1.pop { transform: scale(1.06); }
  p.sub { margin: 0 0 6px; text-align:center; font-size: clamp(.82rem, 2vh, 1rem); opacity:.85; flex:none; }

  /* board: sized by JS to fill whatever space is left */
  .stage { flex:1; min-height:0; width:100%; display:flex; align-items:center; justify-content:center; }
  .frame { position:relative; width:300px; height:300px; }
  #board {
    position:relative; width:100%; height:100%;
    background: var(--cream-2);
    border: 3px solid var(--ink); border-radius: 18px; overflow:hidden;
    box-shadow: 6px 6px 0 var(--ink);
    touch-action:none; transition: box-shadow .6s, transform .6s;
  }
  #board.done { box-shadow: 10px 10px 0 var(--ink); transform: rotate(-1deg); }
  .piece {
    position:absolute; background-repeat:no-repeat;
    border: 1.5px solid var(--cream); border-radius: 3px;
    cursor: grab; transition: left .25s ease, top .25s ease, transform .15s;
    user-select:none; -webkit-user-select:none;
  }
  .piece.drag { z-index: 50; transition:none; transform: scale(1.05); box-shadow: 0 8px 18px rgba(44,58,135,.45); cursor:grabbing; }
  .piece.sel  { outline: 3px solid var(--ink); outline-offset:-3px; z-index: 5; }
  #board.done .piece { border-color: transparent; border-radius:0; cursor:default; }
  #final {
    position:absolute; inset:0; width:100%; height:100%; object-fit:cover;
    opacity:0; transition: opacity 1.6s ease; pointer-events:none; z-index:60;
  }
  #board.done #final { opacity:1; }

  /* side sparkles from the theme art */
  .spark { position:absolute; top: 6%; width: 92px; height:auto; pointer-events:none; }
  .spark.l { right: calc(100% + 18px); }
  .spark.r { left: calc(100% + 18px); transform: scaleX(-1); }
  .spark.l2, .spark.r2 { display:none; }
  @media (max-width: 760px) { .spark { display:none; } }
  .stars { position:absolute; bottom: 10px; width: 56px; pointer-events:none; }
  .stars.l { left: 14px; }
  .stars.r { right: 14px; transform: scaleX(-1); }
  @media (max-width: 500px), (max-height: 640px) { .stars { display:none; } }

  /* controls */
  .row { display:flex; gap:10px; margin-top:6px; padding-bottom:4px; flex:none; flex-wrap:wrap; justify-content:center; position:relative; z-index:2; }
  button {
    font-family: var(--display); font-size: 1rem; letter-spacing:.2px;
    border: 2.5px solid var(--ink); border-radius: 999px; padding: 7px 20px;
    background: var(--cream); color: var(--ink); cursor:pointer;
    box-shadow: 3px 3px 0 var(--ink); transition: transform .1s, box-shadow .1s, background .2s;
  }
  button:hover { background: var(--cream-2); }
  button:active { transform: translate(3px,3px); box-shadow: 0 0 0 var(--ink); }
  canvas#confetti { position:fixed; inset:0; pointer-events:none; z-index:100; }
</style>
</head>
<body>

<img id="cake" src="cake.png" alt="">
<h1 id="title">A little puzzle</h1>
<p class="sub" id="sub">Put the picture back together to unlock your surprise</p>

<div class="stage" id="stage">
  <div class="frame" id="frame">
    <img class="spark l" src="sparkle.png" alt="">
    <img class="spark r" src="sparkle.png" alt="">
    <div id="board"><img id="final" alt="Happy Birthday"></div>
  </div>
</div>

<div class="row">
  <button id="shuffleBtn">Shuffle</button>
  <button id="peekBtn">Peek</button>
  <button id="muteBtn" style="display:none">Play the song again</button>
</div>

<img class="stars l" src="stars.png" alt="">
<img class="stars r" src="stars.png" alt="">
<canvas id="confetti"></canvas>

<script>
/* ============ EDIT THESE ============ */
const NAME        = "Sukriti";        // leave "" for no name
const PUZZLE_FILE = "puzzle.jpg";     // the picture that gets jumbled
const FINAL_FILE  = "photo.jpg";      // the picture revealed when the puzzle is solved
const COLS = 4, ROWS = 4;             // puzzle size. 3x3 is easier, 5x5 is harder
const MUSIC_FILE  = "sukritifirework.mp3";               // optional: e.g. "song.mp3". Leave "" for the built-in Happy Birthday tune
/* ==================================== */

const board = document.getElementById("board");
const finalImg = document.getElementById("final");
const titleEl = document.getElementById("title");
const subEl = document.getElementById("sub");
let pieces = [], order = [], cellW, cellH, imgRatio = 1, imgURL = PUZZLE_FILE;
let solved = false, selected = null, audioCtx = null;

const TITLE_START = NAME ? `A little puzzle for ${NAME}` : "A little puzzle";
const TITLE_DONE  = NAME ? `Happy Birthday, ${NAME}!` : "Happy Birthday!";
const SUB_START = "Put the picture back together to unlock your surprise";
const SUB_DONE  = "Made with love, just for you";
titleEl.textContent = TITLE_START;
finalImg.src = FINAL_FILE;                       // preload the reveal image

/* ---------- load puzzle image ---------- */
function loadImage() {
  const img = new Image();
  img.onload = () => { imgRatio = img.naturalWidth / img.naturalHeight; start(); };
  img.onerror = () => { imgURL = makeFallback(); imgRatio = 4/3; start(); };
  img.src = PUZZLE_FILE;
}
function makeFallback() {
  const c = document.createElement("canvas"); c.width = 800; c.height = 600;
  const g = c.getContext("2d");
  g.fillStyle = "#f6f4e4"; g.fillRect(0,0,800,600);
  g.fillStyle = "#2c3a87"; g.font = "bold 54px serif"; g.textAlign = "center";
  g.fillText(PUZZLE_FILE + " not found", 400, 320);
  return c.toDataURL();
}

/* ---------- layout ---------- */
function fit() {
  const st = document.getElementById("stage"), fr = document.getElementById("frame");
  const maxW = Math.min(st.clientWidth, 560) - 14;      // room for the offset shadow
  const maxH = st.clientHeight - 18;
  let w = maxW, h = w / imgRatio;
  if (h > maxH) { h = maxH; w = h * imgRatio; }
  fr.style.width = Math.max(120, w) + "px"; fr.style.height = Math.max(120, h) + "px";
}
function start() {
  fit();
  buildPieces();
  shuffle();
}
function size() {
  const r = board.getBoundingClientRect();
  cellW = r.width / COLS; cellH = r.height / ROWS;
  return r;
}
function buildPieces() {
  pieces.forEach(p => p.remove()); pieces = [];
  size();
  for (let i = 0; i < COLS * ROWS; i++) {
    const el = document.createElement("div");
    el.className = "piece";
    el.dataset.id = i;
    el.style.backgroundImage = `url("${imgURL}")`;
    attachDrag(el);
    board.insertBefore(el, finalImg); pieces.push(el);
  }
}
function place() {
  const r = size();
  pieces.forEach(el => {
    el.style.width = cellW + "px"; el.style.height = cellH + "px";
    el.style.backgroundSize = `${r.width}px ${r.height}px`;
    const id = +el.dataset.id;
    el.style.backgroundPosition = `${-(id % COLS) * cellW}px ${-Math.floor(id / COLS) * cellH}px`;
  });
  order.forEach((id, slot) => {
    const el = pieces[id];
    if (el.classList.contains("drag")) return;
    el.style.left = (slot % COLS) * cellW + "px";
    el.style.top  = Math.floor(slot / COLS) * cellH + "px";
  });
}
window.addEventListener("resize", () => { fit(); place(); });

/* ---------- shuffle ---------- */
function shuffle() {
  solved = false; selected = null;
  board.classList.remove("done");
  titleEl.textContent = TITLE_START; subEl.textContent = SUB_START;
  document.getElementById("muteBtn").style.display = "none";
  document.getElementById("peekBtn").style.display = "";
  stopMusic();
  stopCelebration();
  order = [...Array(COLS * ROWS).keys()];
  do {
    for (let i = order.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [order[i], order[j]] = [order[j], order[i]];
    }
  } while (order.every((v, i) => v === i));
  pieces.forEach(p => p.classList.remove("sel"));
  place();
}
document.getElementById("shuffleBtn").onclick = shuffle;

/* peek: briefly show the jumbled picture put together */
document.getElementById("peekBtn").onclick = () => {
  if (solved) return;
  const saved = [...order];
  order = [...Array(COLS * ROWS).keys()]; place();
  setTimeout(() => { order = saved; place(); }, 1200);
};

/* ---------- drag and tap-to-swap ---------- */
function slotAt(x, y) {
  const r = board.getBoundingClientRect();
  const cx = Math.min(COLS - 1, Math.max(0, Math.floor((x - r.left) / cellW)));
  const cy = Math.min(ROWS - 1, Math.max(0, Math.floor((y - r.top) / cellH)));
  return cy * COLS + cx;
}
function swapSlots(a, b) {
  [order[a], order[b]] = [order[b], order[a]];
  place(); checkSolved();
}
function attachDrag(el) {
  let startX, startY, offX, offY, moved, fromSlot;
  el.addEventListener("pointerdown", e => {
    if (solved) return;
    ensureAudio();                       // unlock audio on first touch
    el.setPointerCapture(e.pointerId);
    const r = el.getBoundingClientRect();
    startX = e.clientX; startY = e.clientY;
    offX = e.clientX - r.left; offY = e.clientY - r.top;
    moved = false; fromSlot = order.indexOf(+el.dataset.id);
  });
  el.addEventListener("pointermove", e => {
    if (!el.hasPointerCapture(e.pointerId) || solved) return;
    if (!moved && Math.hypot(e.clientX - startX, e.clientY - startY) < 6) return;
    moved = true; el.classList.add("drag");
    const b = board.getBoundingClientRect();
    el.style.left = e.clientX - b.left - offX + "px";
    el.style.top  = e.clientY - b.top  - offY + "px";
  });
  el.addEventListener("pointerup", e => {
    if (solved) return;
    el.classList.remove("drag");
    if (moved) {
      const to = slotAt(e.clientX, e.clientY);
      if (to !== fromSlot) swapSlots(fromSlot, to); else place();
    } else {
      if (selected === null) { selected = fromSlot; el.classList.add("sel"); }
      else if (selected === fromSlot) { selected = null; el.classList.remove("sel"); }
      else {
        pieces.forEach(p => p.classList.remove("sel"));
        const a = selected; selected = null; swapSlots(a, fromSlot);
      }
    }
  });
}

/* ---------- win ---------- */
function checkSolved() {
  if (!order.every((v, i) => v === i)) return;
  solved = true;
  board.classList.add("done");                     // fades in the birthday photo
  titleEl.textContent = TITLE_DONE; subEl.textContent = SUB_DONE;
  titleEl.classList.add("pop"); setTimeout(() => titleEl.classList.remove("pop"), 700);
  document.getElementById("peekBtn").style.display = "none";
  document.getElementById("muteBtn").style.display = "";
  playMusic();
  celebrate();
}

/* ---------- music ---------- */
let fileAudio = null, timers = [];
function ensureAudio() {
  if (!audioCtx) {
    const AC = window.AudioContext || window.webkitAudioContext;
    audioCtx = new AC();
  }
  if (audioCtx.state === "suspended") audioCtx.resume();
}
function stopMusic() {
  timers.forEach(clearTimeout); timers = [];
  if (fileAudio) { fileAudio.pause(); fileAudio.currentTime = 0; }
  if (audioCtx && audioCtx.state === "running") {
    // cut any scheduled notes by swapping to a fresh context
    audioCtx.close().catch(()=>{}); audioCtx = null;
  }
}
function playMusic() {
  stopMusic();
  if (MUSIC_FILE) {
    fileAudio = fileAudio || new Audio(MUSIC_FILE);
    fileAudio.play().catch(()=>{});
    return;
  }
  ensureAudio();
  // Happy Birthday (public domain melody) as a lively waltz: piano-like melody + bass + chords.
  const N = {G3:196, B3:246.94, C4:261.63, E4:329.63, F4:349.23, G4:392, A3:220, Bb3:233.08,
             A4:440, B4:493.88, C5:523.25, D5:587.33, E5:659.25, F5:698.46, G5:783.99,
             C3:130.81, G2:98, F2:87.31};
  const melody = [                     // [note, beats]  (3 beats per bar, 1-beat pickup)
    ["G4",.75],["G4",.25],                                   // pickup
    ["A4",1],["G4",1],["C5",1],  ["B4",2],["G4",.75],["G4",.25],
    ["A4",1],["G4",1],["D5",1],  ["C5",2],["G4",.75],["G4",.25],
    ["G5",1],["E5",1],["C5",1],  ["B4",1],["A4",2],
    ["F5",.75],["F5",.25],["E5",1],["C5",1],  ["D5",1],["C5",3]
  ];
  const bars = [                        // [bass, chord stab notes] for each bar after the pickup
    ["C3",["E4","G4"]], ["G2",["B3","F4"]], ["G2",["B3","F4"]], ["C3",["E4","G4"]],
    ["C3",["E4","G4"]], ["G2",["B3","F4"]], ["F2",["A3","C4"]], ["C3",["E4","G4"]], ["C3",["E4","G4"]]
  ];
  const beat = 0.36;                    // seconds per beat (brisk waltz)
  const out = audioCtx.createGain(); out.gain.value = 0.9; out.connect(audioCtx.destination);
  const t0 = audioCtx.currentTime + 0.15;

  function tone(freq, start, dur, vol, type, decay) {
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(0, start);
    g.gain.linearRampToValueAtTime(vol, start + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0008, start + Math.min(dur * decay, dur + 0.4));
    o.connect(g).connect(out);
    o.start(start); o.stop(start + dur + 0.45);
  }
  function piano(freq, start, dur) {    // bright attack, quick decay, two overtones
    tone(freq,     start, dur, 0.20, "triangle", 1.1);
    tone(freq * 2, start, dur, 0.07, "sine",     0.7);
    tone(freq * 3, start, dur, 0.025,"sine",     0.4);
  }

  // melody
  let b = 0;
  melody.forEach(([n, len]) => {
    piano(N[n], t0 + b * beat, len * beat);
    b += len;
  });
  // accompaniment: bass on beat 1, chord stabs on beats 2 and 3 (oom-pah-pah), starting after the pickup
  bars.forEach(([bass, chord], i) => {
    const barStart = t0 + (1 + i * 3) * beat;
    tone(N[bass], barStart, beat * 1.6, 0.30, "triangle", 1.0);
    [1, 2].forEach(k => chord.forEach(c => tone(N[c], barStart + k * beat, beat * 0.8, 0.07, "triangle", 0.9)));
  });
}
document.getElementById("muteBtn").onclick = playMusic;

/* ---------- celebration: endless confetti + a few simple fireworks ---------- */
let celeb = false, celebRAF = 0, celebResize = null;
const rnd = (a, b) => a + Math.random() * (b - a);
const FW_COLORS = ["#2c3a87", "#5a67b4", "#ff6b8b", "#f4b942", "#2bb3a3"];

function stopCelebration() {
  celeb = false; cancelAnimationFrame(celebRAF);
  if (celebResize) { window.removeEventListener("resize", celebResize); celebResize = null; }
  const c = document.getElementById("confetti");
  c.getContext("2d").clearRect(0, 0, c.width, c.height);
}
function celebrate() {
  stopCelebration();
  celeb = true;
  const c = document.getElementById("confetti"), g = c.getContext("2d");
  const resize = () => { c.width = innerWidth; c.height = innerHeight; };
  celebResize = resize; resize(); window.addEventListener("resize", resize);

  const colors = ["#2c3a87", "#2c3a87", "#5a67b4", "#9aa3dc", "#f6f4e4", "#ffffff"];
  const makeBit = (fromTop) => ({
    x: Math.random() * c.width, y: fromTop ? -20 : -20 - Math.random() * c.height,
    w: 6 + Math.random() * 8, h: 8 + Math.random() * 10,
    vy: 2 + Math.random() * 3, vx: -1.2 + Math.random() * 2.4,
    r: Math.random() * 6, vr: -.2 + Math.random() * .4,
    col: colors[Math.floor(Math.random() * colors.length)]
  });
  const bits = Array.from({ length: 130 }, () => makeBit(false));
  let rockets = [], sparks = [], nextLaunch = 600;

  function launch() {
    rockets.push({ x: rnd(c.width * .1, c.width * .9), y: c.height + 6, vy: -rnd(9, 12),
                   ty: rnd(c.height * .12, c.height * .45), col: FW_COLORS[Math.floor(Math.random() * FW_COLORS.length)] });
  }
  function burst(x, y, col) {
    const n = 46;
    for (let i = 0; i < n; i++) {
      const a = (i / n) * Math.PI * 2 + rnd(-.1, .1), sp = rnd(1.8, 4.6);
      sparks.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 1, col });
    }
  }

  let t0 = null;
  (function loop(ts) {
    if (!celeb) return;
    if (t0 === null) t0 = ts;
    const now = ts - t0;
    g.clearRect(0, 0, c.width, c.height);

    // fireworks: one rocket roughly every 1.2s
    if (now > nextLaunch) { launch(); nextLaunch = now + rnd(900, 1600); }
    for (let i = rockets.length - 1; i >= 0; i--) {
      const r = rockets[i];
      r.y += r.vy; r.vy *= .985;
      g.fillStyle = r.col; g.beginPath(); g.arc(r.x, r.y, 2.4, 0, 7); g.fill();
      g.globalAlpha = .35; g.beginPath(); g.arc(r.x, r.y + 8, 1.8, 0, 7); g.fill(); g.globalAlpha = 1;
      if (r.y <= r.ty || r.vy > -2) { burst(r.x, r.y, r.col); rockets.splice(i, 1); }
    }
    g.lineCap = "round"; g.lineWidth = 2.4;
    for (let i = sparks.length - 1; i >= 0; i--) {
      const p = sparks[i], px = p.x, py = p.y;
      p.vx *= .985; p.vy = p.vy * .985 + .05; p.x += p.vx; p.y += p.vy; p.life -= .017;
      if (p.life <= 0) { sparks.splice(i, 1); continue; }
      g.globalAlpha = Math.min(1, p.life * 1.5); g.strokeStyle = p.col;
      g.beginPath(); g.moveTo(px, py); g.lineTo(p.x, p.y); g.stroke();
    }
    g.globalAlpha = 1;

    // confetti keeps falling; anything that leaves the bottom goes back to the top
    bits.forEach((b, i) => {
      b.x += b.vx; b.y += b.vy; b.r += b.vr;
      if (b.y > c.height + 20) bits[i] = makeBit(true);
      g.save(); g.translate(b.x, b.y); g.rotate(b.r);
      g.fillStyle = b.col; g.fillRect(-b.w / 2, -b.h / 2, b.w, b.h); g.restore();
    });
    celebRAF = requestAnimationFrame(loop);
  })(performance.now());
}

loadImage();
</script>
</body>
</html>
